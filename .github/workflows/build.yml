name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Android project
        id: check
        run: |
          ls -la > build-log.txt
          if [ -f settings.gradle.kts ] && [ -d app ]; then
            echo "has_project=true" >> $GITHUB_OUTPUT
          else
            echo "has_project=false" >> $GITHUB_OUTPUT
          fi

      - name: Build debug APK
        if: steps.check.outputs.has_project == 'true'
        run: |
          echo "== VERSIONS ==" >> build-log.txt
          java -version 2>&1 >> build-log.txt
          echo "== INSTALL GRADLE 8.9 ==" >> build-log.txt
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version 2>&1 >> build-log.txt
          echo "== BUILD START ==" >> build-log.txt
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build-log.txt
          echo "== BUILD DONE ==" >> build-log.txt
          ls -la app/build/outputs/apk/debug/ >> build-log.txt 2>&1 || echo "NO APK OUTPUT DIR" >> build-log.txt

      - name: Upload APK to Release
        if: steps.check.outputs.has_project == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "APK جاهز للتنزيل"
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare failure logs
        if: failure()
        run: |
          { echo "== ENV =="; env; echo "== FILES =="; ls -la; } >> build-log.txt 2>/dev/null || true

      - name: Commit build log to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-log.txt
          git commit -m "chore: build log" --no-verify || echo "nothing to commit"
          git push || echo "push failed"
