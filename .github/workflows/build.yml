name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug APK (سجل كامل)
        run: |
          echo "== VERSIONS ==" | tee build-log.txt
          java -version 2>&1 | tee -a build-log.txt
          gradle --version 2>&1 | tee -a build-log.txt
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a build-log.txt
          echo "== BUILD START ==" | tee -a build-log.txt
          gradle assembleDebug --no-daemon 2>&1 | tee -a build-log.txt

      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "لعبة اصطاد النقطة v1.0"
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare failure logs
        if: failure()
        run: |
          { echo "== ENV =="; env; echo "== FILES =="; ls -la; } >> build-log.txt 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failed
          name: "فشل البناء — سجل الأخطاء"
          files: build-log.txt
