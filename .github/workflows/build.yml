name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (مع حفظ السجل)
        run: gradle assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "لعبة اصطاد النقطة v1.0"
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failed
          name: "فشل البناء — سجل الأخطاء"
          files: build-log.txt
